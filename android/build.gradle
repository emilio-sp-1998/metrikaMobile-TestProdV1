buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
    // Use a Kotlin version compatible with the React Native Gradle plugin and Android Gradle
    // (Kotlin 2.0 can cause incompatibilities with some plugins). 1.9.10 is a stable choice.
    kotlinVersion = "1.9.10"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
    // Specify a stable AGP version compatible with the Gradle wrapper in this project.
    classpath("com.android.tools.build:gradle:8.1.0")
    classpath("com.facebook.react:react-native-gradle-plugin")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
    }
}

apply plugin: "com.facebook.react.rootproject"
